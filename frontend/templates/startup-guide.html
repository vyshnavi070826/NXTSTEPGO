<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founder's Execution Roadmap — NxtStepGo</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/style/styles.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .guide-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
            margin: 32px 0 80px 0;
        }
        @media (max-width: 600px) {
            .guide-grid {
                grid-template-columns: 1fr;
            }
        }
        .step-card {
            background: #ffffff;
            border-radius: var(--radius-cards);
            border: 1px solid rgba(22, 22, 24, 0.07);
            box-shadow: var(--shadow-lg);
            padding: 32px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.25s ease;
        }
        .step-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lift);
            border-color: rgba(13, 68, 232, 0.25);
        }
    </style>
</head>
<body style="background-color: var(--color-paper-white);">

    <!-- Studio Navigation Bar -->
    <header id="navbar" class="studio-navbar">
        <div class="container" style="display: flex; align-items: center; justify-content: space-between;">
            <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
                <div style="width: 32px; height: 32px; border-radius: 9px; background: var(--color-studio-black); display: flex; align-items: center; justify-content: center; color: white;">
                    <i data-lucide="compass" style="width: 18px; height: 18px;"></i>
                </div>
                <div style="display: flex; flex-direction: column; line-height: 1.1;">
                    <span style="font-weight: 700; font-size: 16px; letter-spacing: -0.3px; color: var(--color-absolute-ink);">NxtStepGo</span>
                    <span style="font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-soft-charcoal);">Founder's Roadmap</span>
                </div>
            </a>

            <div style="display: flex; align-items: center; gap: 10px;">
                <a id="back-hub-btn" href="#" class="btn-white-outline" style="padding: 8px 16px; font-size: 14px;">
                    <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
                    Back to Hub
                </a>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 130px; min-height: 85vh;">
        <!-- Header -->
        <div style="margin-bottom: 40px;">
            <span class="badge-studio" style="margin-bottom: 12px;" id="dept-badge">Biotechnology</span>
            <h1 class="font-section-heading" style="margin: 0 0 8px 0;">Founder's Step-by-Step Incubation Guide</h1>
            <p class="font-body-lead" style="margin: 0; max-width: 680px;">
                How to incorporate, register with DPIIT for 80-IAC tax exemptions, apply for fast-track bio/chemical patents, and enter institutional incubators.
            </p>
        </div>

        <div id="guide-grid" class="guide-grid"></div>
    </main>

    <!-- Scripts -->
    <script src="/script/data.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const deptId = urlParams.get('dept') || 'biotech';

        const deptInfo = DEPARTMENTS.find(d => d.id === deptId) || DEPARTMENTS[0];
        document.getElementById('back-hub-btn').href = `/hub.html?dept=${deptId}`;
        document.getElementById('dept-badge').textContent = deptInfo.name;

        const deptData = DATA[deptId] || DATA['biotech'];
        const guideData = (deptData.startups && deptData.startups.guide) ? deptData.startups.guide : [];

        const grid = document.getElementById('guide-grid');
        guideData.forEach((step, i) => {
            const card = document.createElement('div');
            card.className = 'step-card';
            card.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
                    <span class="badge-studio" style="font-size: 12px; padding: 4px 10px;">Step 0${i + 1}</span>
                    <span class="badge-blue-pill">${step.tag || "National Recognition"}</span>
                </div>

                <h3 style="font-size: 22px; font-weight: 600; color: var(--color-absolute-ink); margin: 0 0 10px 0; letter-spacing: -0.3px;">
                    ${step.title}
                </h3>

                <p style="font-size: 14px; line-height: 1.5; color: var(--color-soft-charcoal); margin: 0 0 20px 0;">
                    ${step.content}
                </p>

                ${step.steps ? `
                    <div style="background: #fbfbfd; border-radius: 12px; padding: 14px; border: 1px solid rgba(22,22,24,0.06); margin-bottom: 16px;">
                        <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--color-soft-charcoal); margin-bottom: 4px; display: flex; align-items: center; gap: 4px;">
                            <i data-lucide="check-circle" style="width: 12px; height: 12px; color: var(--color-electric-capture-blue);"></i>
                            Process Steps
                        </div>
                        <div style="font-size: 13px; font-weight: 500; color: var(--color-graphite); line-height: 1.4;">${step.steps}</div>
                    </div>
                ` : ''}

                ${step.req ? `
                    <div style="margin-bottom: 20px;">
                        <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--color-soft-charcoal); margin-bottom: 4px;">
                            Eligibility Criteria:
                        </div>
                        <div style="font-size: 13px; color: var(--color-soft-charcoal); line-height: 1.4;">${step.req}</div>
                    </div>
                ` : ''}

                <div style="margin-top: auto; border-top: 1px solid rgba(22, 22, 24, 0.06); padding-top: 16px; display: flex; align-items: center; justify-content: space-between;">
                    <a href="${step.url}" target="_blank" rel="noopener noreferrer" class="btn-electric" style="padding: 8px 16px; font-size: 13px;">
                        Access Portal ↗
                    </a>
                    <span style="font-size: 12px; color: var(--color-soft-charcoal); font-weight: 500;">${step.contact || "Online Apply"}</span>
                </div>
            `;
            grid.appendChild(card);
        });

        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>
