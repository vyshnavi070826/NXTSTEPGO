<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industry & Research Careers — NxtStepGo</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/style/styles.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
            margin: 32px 0 80px 0;
        }
        @media (max-width: 600px) {
            .jobs-grid {
                grid-template-columns: 1fr;
            }
        }
        .job-card {
            background: #ffffff;
            border-radius: var(--radius-cards);
            border: 1px solid rgba(22, 22, 24, 0.07);
            box-shadow: var(--shadow-lg);
            padding: 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.25s ease;
        }
        .job-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lift);
            border-color: rgba(13, 68, 232, 0.25);
        }
        .bookmark-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid rgba(22, 22, 24, 0.08);
            background: #ffffff;
            color: var(--color-soft-charcoal);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .bookmark-btn:hover {
            border-color: var(--color-electric-capture-blue);
            color: var(--color-electric-capture-blue);
            background: rgba(13, 68, 232, 0.05);
        }
        .bookmark-btn.bookmarked {
            background: rgba(13, 68, 232, 0.1);
            color: var(--color-electric-capture-blue);
            border-color: var(--color-electric-capture-blue);
        }
        .filter-chip {
            font-size: 13px;
            font-weight: 550;
            padding: 7px 14px;
            border-radius: var(--radius-chips);
            border: 1px solid rgba(22, 22, 24, 0.1);
            background: #ffffff;
            color: var(--color-graphite);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-chip.active {
            background: var(--color-studio-black);
            color: #ffffff;
            border-color: var(--color-studio-black);
        }
        .toast-notify {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--color-studio-black);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 550;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            z-index: 9999;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body style="background-color: var(--color-paper-white);">

    <!-- Toast Notification -->
    <div id="toast" class="toast-notify">
        <i data-lucide="check-circle" style="width: 16px; height: 16px; color: #22c55e;"></i>
        <span id="toast-text">Job saved to bookmarks</span>
    </div>

    <!-- Studio Navigation Bar -->
    <header id="navbar" class="studio-navbar">
        <div class="container" style="display: flex; align-items: center; justify-content: space-between;">
            <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
                <div style="width: 32px; height: 32px; border-radius: 9px; background: var(--color-studio-black); display: flex; align-items: center; justify-content: center; color: white;">
                    <i data-lucide="compass" style="width: 18px; height: 18px;"></i>
                </div>
                <div style="display: flex; flex-direction: column; line-height: 1.1;">
                    <span style="font-weight: 700; font-size: 16px; letter-spacing: -0.3px; color: var(--color-absolute-ink);">NxtStepGo</span>
                    <span style="font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-soft-charcoal);">Careers & Placements</span>
                </div>
            </a>

            <div style="display: flex; align-items: center; gap: 10px;">
                <a id="back-hub-btn" href="#" class="btn-white-outline" style="padding: 8px 16px; font-size: 14px;">
                    <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
                    Back to Hub
                </a>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 130px; min-height: 85vh;">
        <!-- Header -->
        <div style="margin-bottom: 32px;">
            <span class="badge-studio" style="margin-bottom: 12px;" id="dept-badge">Biotechnology</span>
            <h1 class="font-section-heading" style="margin: 0 0 8px 0;">Industry & Research Placement Roles</h1>
            <p class="font-body-lead" style="margin: 0; max-width: 680px;">
                Curated technical roles, compensation benchmarks, hiring organizations, and direct connections to AI Skill Matching.
            </p>
        </div>

        <!-- Filter Controls -->
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
            <!-- Category Chips -->
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="filter-chip active" data-category="all">All Roles</button>
                <button class="filter-chip" data-category="Research">Research & Academia</button>
                <button class="filter-chip" data-category="Industry">Industry & Scale-Up</button>
            </div>

            <!-- Search -->
            <div style="position: relative; max-width: 320px; width: 100%;">
                <input type="text" id="job-search" class="input-studio" placeholder="Search roles or companies..." style="padding-left: 36px;">
                <i data-lucide="search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: #98989a;"></i>
            </div>
        </div>

        <!-- Jobs Grid -->
        <div id="jobs-grid" class="jobs-grid"></div>
    </main>

    <!-- Scripts -->
    <script src="/script/data.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const deptId = urlParams.get('dept') || 'biotech';
        const userId = localStorage.getItem('userId');

        const deptInfo = DEPARTMENTS.find(d => d.id === deptId) || DEPARTMENTS[0];
        document.getElementById('back-hub-btn').href = `/hub.html?dept=${deptId}`;
        document.getElementById('dept-badge').textContent = deptInfo.name;

        const grid = document.getElementById('jobs-grid');
        const searchInput = document.getElementById('job-search');
        let currentCategory = 'all';

        // Build list of jobs for this department
        let departmentJobs = [];
        const deptData = DATA[deptId];
        if (deptData && deptData.jobRoles) {
            if (Array.isArray(deptData.jobRoles)) {
                departmentJobs = deptData.jobRoles.map(j => ({ ...j, category: 'Industry' }));
            } else {
                const research = (deptData.jobRoles.research || []).map(j => ({ ...j, category: 'Research' }));
                const industry = (deptData.jobRoles.industry || []).map(j => ({ ...j, category: 'Industry' }));
                departmentJobs = [...research, ...industry];
            }
        }

        // Show Toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = msg;
            toast.style.display = 'flex';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        // Bookmark Handler
        async function bookmarkJob(jobTitle, btnEl) {
            if (!userId) {
                showToast('Please sign in to save bookmarks');
                setTimeout(() => window.location.href = '/login.html', 1200);
                return;
            }
            try {
                const response = await fetch('/api/preferences/bookmark', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': userId
                    },
                    body: JSON.stringify({
                        type: 'job',
                        elementId: jobTitle,
                        title: jobTitle,
                        department: deptId,
                        metadata: { deptId }
                    })
                });
                if (response.ok) {
                    btnEl.classList.add('bookmarked');
                    showToast('Job saved to bookmarks');
                }
            } catch (err) {
                console.error(err);
                showToast('Error updating bookmark');
            }
        }

        function renderJobs(query = '') {
            grid.innerHTML = '';
            const q = query.toLowerCase().trim();

            const filtered = departmentJobs.filter(job => {
                const matchesCategory = currentCategory === 'all' || job.category === currentCategory;
                const matchesQuery = job.title.toLowerCase().includes(q) ||
                                     job.jd.toLowerCase().includes(q) ||
                                     (job.companies || []).some(c => c.toLowerCase().includes(q));
                return matchesCategory && matchesQuery;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; padding: 48px; text-align: center; background: white; border-radius: 20px; border: 1px solid rgba(22,22,24,0.06);">
                        <i data-lucide="briefcase" style="width: 36px; height: 36px; color: #98989a; margin-bottom: 12px;"></i>
                        <p style="color: var(--color-soft-charcoal); font-size: 15px; margin: 0;">No matching roles found.</p>
                    </div>
                `;
                if (window.lucide) window.lucide.createIcons();
                return;
            }

            filtered.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';

                const companiesBadges = (job.companies || []).map(c => `
                    <span class="trust-pill" style="font-size: 11px; color: var(--color-graphite);">${c}</span>
                `).join('');

                card.innerHTML = `
                    <button class="bookmark-btn" title="Bookmark job" data-title="${job.title}">
                        <i data-lucide="bookmark" style="width: 16px; height: 16px;"></i>
                    </button>

                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                        <span class="badge-studio" style="font-size: 11px; padding: 4px 8px;">${job.category}</span>
                        <span style="font-size: 13px; font-weight: 700; color: #16a34a;">${job.salary}</span>
                    </div>

                    <h3 style="font-size: 20px; font-weight: 600; color: var(--color-absolute-ink); margin: 0 0 10px 0; padding-right: 40px; letter-spacing: -0.2px;">
                        ${job.title}
                    </h3>

                    <p style="font-size: 14px; line-height: 1.5; color: var(--color-soft-charcoal); margin: 0 0 18px 0; flex-grow: 1;">
                        ${job.jd}
                    </p>

                    <div style="margin-bottom: 20px;">
                        <div style="font-size: 12px; font-weight: 600; color: var(--color-soft-charcoal); margin-bottom: 6px;">Hiring Centers & Companies:</div>
                        <div style="display: flex; flex-wrap: wrap; gap: 6px;">${companiesBadges}</div>
                    </div>

                    <div style="margin-top: auto; border-top: 1px solid rgba(22, 22, 24, 0.06); padding-top: 14px; display: flex; align-items: center; justify-content: space-between;">
                        <a href="/skill-matcher.html?role=${encodeURIComponent(job.title)}&dept=${deptId}" class="btn-electric" style="padding: 7px 14px; font-size: 13px; gap: 6px;">
                            <i data-lucide="zap" style="width: 13px; height: 13px;"></i>
                            Check Skill Match
                        </a>
                        <span style="font-size: 11px; color: var(--color-soft-charcoal); font-weight: 550;">Full Time</span>
                    </div>
                `;

                // Wire Bookmark
                const btn = card.querySelector('.bookmark-btn');
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    bookmarkJob(job.title, btn);
                });

                grid.appendChild(card);
            });

            if (window.lucide) window.lucide.createIcons();
        }

        // Category Filter Buttons
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentCategory = chip.getAttribute('data-category');
                renderJobs(searchInput.value);
            });
        });

        searchInput.addEventListener('input', (e) => {
            renderJobs(e.target.value);
        });

        // Initial render
        renderJobs();
    </script>
</body>
</html>
