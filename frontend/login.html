<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — NxtStepGo</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/style/styles.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: var(--radius-cards);
            border: 1px solid rgba(22, 22, 24, 0.08);
            box-shadow: var(--shadow-mac-window);
            padding: 44px;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }
        @media (max-width: 500px) {
            .auth-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body style="background-color: #fafafc; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Studio Navigation Bar -->
    <header id="navbar" class="studio-navbar">
        <div class="container" style="display: flex; align-items: center; justify-content: space-between;">
            <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
                <div style="width: 32px; height: 32px; border-radius: 9px; background: var(--color-studio-black); display: flex; align-items: center; justify-content: center; color: white;">
                    <i data-lucide="compass" style="width: 18px; height: 18px;"></i>
                </div>
                <div style="display: flex; flex-direction: column; line-height: 1.1;">
                    <span style="font-weight: 700; font-size: 16px; letter-spacing: -0.3px; color: var(--color-absolute-ink);">NxtStepGo</span>
                    <span style="font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-soft-charcoal);">Authentication</span>
                </div>
            </a>

            <div style="display: flex; align-items: center; gap: 10px;">
                <a href="/departments.html" class="btn-white-outline" style="padding: 8px 16px; font-size: 14px;">
                    Skip to Catalog
                </a>
            </div>
        </div>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 120px 24px 60px 24px;">
        <div class="auth-card">
            <!-- Header Icon & Title -->
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="width: 48px; height: 48px; border-radius: 14px; background: var(--color-studio-black); color: white; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
                    <i data-lucide="log-in" style="width: 22px; height: 22px;"></i>
                </div>
                <h1 style="font-size: 26px; font-weight: 700; color: var(--color-absolute-ink); margin: 0 0 8px 0; letter-spacing: -0.4px;">Welcome Back</h1>
                <p style="font-size: 14px; color: var(--color-soft-charcoal); margin: 0; line-height: 1.5;">
                    Sign in to access your saved programs, personal collections, and customized skill matching alerts.
                </p>
            </div>

            <!-- Error Banner -->
            <div id="error-message" style="display: none; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 550; margin-bottom: 20px;"></div>

            <!-- Login Form -->
            <form id="loginForm" style="display: flex; flex-direction: column; gap: 18px;">
                <div>
                    <label for="email" style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-graphite); display: block; margin-bottom: 6px;">
                        Email Address
                    </label>
                    <input type="email" id="email" class="input-studio" placeholder="name@university.edu" required autocomplete="email">
                </div>

                <div>
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                        <label for="password" style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-graphite);">
                            Password
                        </label>
                    </div>
                    <input type="password" id="password" class="input-studio" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div style="margin-top: 8px;">
                    <button type="submit" id="submit-btn" class="btn-electric" style="width: 100%; padding: 14px; font-size: 15px;">
                        Sign In to Student Account
                    </button>
                </div>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--color-soft-charcoal);">
                Don't have an account? 
                <a href="/signup.html" style="font-weight: 600; color: var(--color-electric-capture-blue); text-decoration: none;">
                    Create Account
                </a>
            </div>

            <div style="border-top: 1px solid rgba(22, 22, 24, 0.06); margin-top: 28px; padding-top: 20px; text-align: center;">
                <a href="/departments.html" style="font-size: 13px; font-weight: 600; color: var(--color-soft-charcoal); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
                    Explore branches without signing in <i data-lucide="arrow-right" style="width: 13px; height: 13px;"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        if (window.lucide) window.lucide.createIcons();

        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = `Signing in...`;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('userId', data.userId || (data.user && data.user.id));
                    localStorage.setItem('userName', (data.user && data.user.name) || 'Student');
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    }
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.message || 'Invalid credentials. Please verify your email and password.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Network or server error. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `Sign In to Student Account`;
            }
        });
    </script>
</body>
</html>
